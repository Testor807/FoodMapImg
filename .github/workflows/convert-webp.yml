name: Convert Images to WebP

on:
  push:
    branches:
      - main
    paths:
      - 'Image/**'

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install webp tool
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Create webp directory if not exists
        run: mkdir -p webp

      - name: Convert Images to WebP
        run: |
          # 尋找 Image 資料夾內的 jpg, jpeg, png, JPG, JPEG, PNG 檔案並轉換
          find Image -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while read -r img; do
            # 取得不含路徑的檔名
            filename=$(basename "$img")
            # 取得不含副檔名的主檔名
            name="${filename%.*}"
            # 轉換圖片並輸出至 webp/ 資料夾，品質設定為 80
            cwebp -q 80 "$img" -o "webp/${name}.webp"
          done

      - name: Commit and push converted WebP files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add webp/
          # 檢查是否有檔案更新，若有則 Commit & Push
          if git diff --staged --quiet; then
            echo "沒有需要更新的 WebP 圖片"
          else
            git commit -m "auto: convert uploaded images to webp"
            git push
          fi
