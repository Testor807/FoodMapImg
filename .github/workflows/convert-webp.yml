name: Convert Images to WebP

on:
  push:
    branches:
      - main
    paths:
      - 'Image/**'
      - '*.jpg'
      - '*.jpeg'
      - '*.png'
      - '*.JPG'
      - '*.JPEG'
      - '*.PNG'
  workflow_dispatch: # 啟用手動觸發按鈕

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install webp tool
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Create webp directory if not exists
        run: mkdir -p webp

      - name: Convert Images to WebP
        run: |
          find . -maxdepth 2 \( -path "./Image/*" -o -path "./*" \) -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while read -r img; do
            filename=$(basename "$img")
            name="${filename%.*}"
            cwebp -q 80 "$img" -o "webp/${name}.webp"
          done

      - name: Commit and push converted WebP files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add webp/
          if git diff --staged --quiet; then
            echo "沒有需要更新的 WebP 圖片"
          else
            git commit -m "auto: convert uploaded images to webp"
            git push
          fi
